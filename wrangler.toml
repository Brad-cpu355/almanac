name = "almanac"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Static frontend
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Production database
[[d1_databases]]
binding = "DB"
database_name = "almanac-db"
database_id = "0ccee185-278b-482c-a17b-5e53f8735a30"

# Preview configuration
[[previews.d1_databases]]
binding = "DB"
database_name = "almanac-preview-db"
database_id = "f50b5543-5c47-4956-930c-ba9473650b6f"

[[vpc_services]]
binding = "PHOTONLOG_VPC"
service_id = "01a21c44-b7a5-7b03-95bf-4737bf456d9f"

[triggers]
# The Worker selects 18:00 Europe/Stockholm, including daylight saving time.
crons = ["0 16,17 * * *"]
